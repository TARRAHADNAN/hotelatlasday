version: '3.8'

services:
  strapi:
    container_name: hotelatlasday-strapi
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run develop"
    ports:
      - "1337:1337"
    volumes:
      - ./cms:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_CLIENT=sqlite
      - DATABASE_FILENAME=.tmp/data.db
    restart: unless-stopped
    networks:
      - hotelatlasday

  # Optionnel : PostgreSQL pour production
  # postgres:
  #   container_name: hotelatlasday-postgres
  #   image: postgres:15-alpine
  #   environment:
  #     POSTGRES_DB: hotel_atlas_cms
  #     POSTGRES_USER: strapi
  #     POSTGRES_PASSWORD: strapi_password_change_me
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - hotelatlasday

networks:
  hotelatlasday:
    driver: bridge

